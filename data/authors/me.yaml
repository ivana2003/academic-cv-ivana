bio: |
  I am a PhD student in Statistics and Computer Science at Bocconi University.
  My research interests include Natural Language Processing, Large Language Models,
  trustworthy and personalized NLP, machine learning theory, algorithms and
  optimization, with a particular interest in the theoretical analysis of
  user-conditioned objective functions and the geometry and topology of
  loss landscapes.

